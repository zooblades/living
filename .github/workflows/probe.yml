name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.6.0" }
      - name: Inspect 26.3 input handling
        run: |
          set +e
          mkdir -p out
          (cd versions/26.3 && gradle build --no-daemon -q > ../../out/build.txt 2>&1)
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged.jar' | grep '/26.3/' | head -1)
          echo "jar=$J" > out/inspect.txt
          {
            echo "== InputConstants"; javap -p -constants -cp "$J" com.mojang.blaze3d.platform.InputConstants | grep -iE "MOUSE|KEY_ENTER|KEY_BACKSPACE|KEY_ESCAPE|KEY_RETURN" | head -20
            echo "== sdl/input classes"; unzip -Z1 "$J" | grep -iE "MouseHandler|KeyboardHandler|sdl|MouseButton" | head -20
            echo "== MouseHandler methods"; javap -p -cp "$J" net.minecraft.client.MouseHandler | head -60
          } >> out/inspect.txt 2>&1
          javap -p -c -constants -cp "$J" net.minecraft.client.MouseHandler > out/mousehandler.txt 2>&1
          javap -p -c -constants -cp "$J" net.minecraft.client.KeyboardHandler > out/keyboardhandler.txt 2>&1
          javap -p -c -constants -cp "$J" net.minecraft.client.input.MouseButtonInfo > out/mbi.txt 2>&1
          cd out && git init -q -b probe-out && git config user.name probe && git config user.email p@users.noreply.github.com && git add -A && git commit -qm probe
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} probe-out
