name: e2e
on:
  push:
    branches: [e2e]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.5.1" }
      - name: Install virtual display + software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libopenal1 mesa-utils
      - name: Run the game under a virtual display
        working-directory: tests/e2e
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
        run: |
          mkdir -p run
          printf 'onboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\npauseOnLostFocus:false\nguiScale:2\nenableVsync:false\nmaxFps:30\nnarrator:0\n' > run/options.txt
          set +e
          timeout 1500 xvfb-run -a --server-args="-screen 0 1280x720x24" gradle runClient --no-daemon --stacktrace > ../../e2e.log 2>&1
          echo "exit=$?" >> ../../e2e.log
      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          cp e2e.log out/ || true
          J=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -name '*.jar' | grep -E '/minecraft-merged/1.21.1-' | head -1); [ -n "$J" ] && javap -p -cp "$J" net.minecraft.client.gui.screen.world.CreateWorldScreen | grep -E 'static|CreateWorldScreen\(' > out/javap.txt || true
          find ~/.gradle -iname '*gametest*' -name '*.jar' | head -20 > out/gametest_jars.txt
          find tests/e2e -path '*screenshots*' -name '*.png' -exec cp {} out/ \; || true
          find tests/e2e -name 'latest.log' -exec cp {} out/latest.log \; || true
          grep -E "error:|What went wrong|FAILED|Exception" -A2 e2e.log | head -60 | cut -c1-250 > out/summary.txt || true
          ls -la out
          cd out
          git init -q -b e2e-out
          git config user.name e2e && git config user.email e2e@users.noreply.github.com
          git add -A && git commit -qm "e2e output"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} e2e-out
