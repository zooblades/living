name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            MSG=$(grep -E "error:|What went wrong|Could not|FAILED|Exception|cannot find symbol|symbol:|location:" -A2 build.log | head -45 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Build errors::$MSG"
          fi
          exit $code

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-inventory-${{ github.sha }}
          path: |
            build/libs/*.jar
            build.log
          if-no-files-found: warn
