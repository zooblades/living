name: build

on:
  push:
    branches-ignore: [probe, probe-out]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: "1.21.1", java: 21, gradle: "8.8" }
    name: build ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build
        working-directory: versions/${{ matrix.dir }}
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            MSG=$(grep -E "error:|What went wrong|Could not|FAILED|Exception|cannot find symbol|symbol:|location:" -A2 build.log | head -45 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Build errors ${{ matrix.dir }}::$MSG"
          fi
          exit $code

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-inventory-${{ matrix.dir }}-${{ github.sha }}
          path: |
            versions/${{ matrix.dir }}/build/libs/*.jar
            !versions/${{ matrix.dir }}/build/libs/*-sources.jar
            versions/${{ matrix.dir }}/build.log
          if-no-files-found: warn
